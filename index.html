<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GameFlix</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-900 text-white">
    <!-- CABEÇALHO -->
    <header class="bg-gray-800 p-6 text-center shadow-lg">
      <h1 class="text-3xl font-bold">GameFlix</h1>
      <h2 class="text-xl">Bem-vindo ao nosso site de games</h2>
    </header>

    <!-- MENU -->
    <nav
      class="bg-gray-800 p-4 flex flex-col md:flex-row gap-4 justify-center items-center"
    >
      <a href="#" class="text-lg font-semibold hover:text-blue-400 transition">
        Catálogo
      </a>
      <a href="#" class="text-lg font-semibold hover:text-blue-400 transition">
        Promoções
      </a>
      <a href="#" class="text-lg font-semibold hover:text-blue-400 transition">
        Novidades
      </a>
      <a href="#" class="text-lg font-semibold hover:text-blue-400 transition">
        Jogos Grátis
      </a>
      <a href="#" class="text-lg font-semibold hover:text-blue-400 transition">
        Próximos Lançamentos
      </a>

      <!-- BUSCA -->
      <div>
        <span class="text-gray-400"> Buscar: </span>
        <input
          id="campoBusca"
          type="text"
          placeholder="Buscar games..."
          class="bg-gray-700 text-white px-3 py-2 rounded-lg placeholder:text-gray-500 border border-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </nav>

    <!-- CATÁLOGO -->
    <main>
      <!-- AQUI ESTÁ A CORREÇÃO: O ID agora é "catalogo-jogos" para o script.js conseguir achar! -->
      <section
        id="catalogo-jogos"
        class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <p class="text-gray-400 col-span-full text-center">
          Carregando jogos...
        </p>
      </section>
    </main>

    <!-- NEWSLETTER -->
    <section class="max-w-7xl mx-auto p-6">
      <h2 class="text-2xl font-bold mb-4">
        Inscreva-se para receber novidades
      </h2>

      <form id="newsletterForm" class="flex flex-col md:flex-row gap-4">
        <input
          id="emailNewsletter"
          type="email"
          required
          placeholder="Digite seu e-mail"
          class="flex-1 bg-gray-700 text-white px-3 py-2 rounded-lg placeholder:text-gray-500 border border-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
          type="submit"
          class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
        >
          Inscrever-se
        </button>
      </form>
    </section>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
  </body>
</html>
